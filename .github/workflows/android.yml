name: BASH Android Export - Verify and Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$base/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$base/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Prepare signing and check SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -d "$JAVA_HOME"
          keytool -genkeypair -keystore "$RUNNER_TEMP/bash-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "BASH_KEY=$RUNNER_TEMP/bash-debug.keystore" >> "$GITHUB_ENV"
      - name: Import project and create real editor settings
        shell: bash
        run: |
          set -uo pipefail
          godot --headless --editor --path . --import > build/import-log.txt 2>&1
          result=$?
          cat build/import-log.txt
          exit "$result"
      - name: Configure editor settings and signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSET'
          import os, re
          from pathlib import Path

          path = Path.home() / '.config/godot/editor_settings-4.tres'
          path.parent.mkdir(parents=True, exist_ok=True)
          # Create a valid resource section even if the editor has not written one.
          if path.exists():
              content = path.read_text()
          else:
              content = ''
          if '[resource]' not in content:
              content = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'

          values = {
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/debug_keystore': os.environ['BASH_KEY'],
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          for key, value in values.items():
              line = key + ' = "' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
              pattern = r'^' + re.escape(key) + r'\s*=.*$'
              if re.search(pattern, content, re.MULTILINE):
                  content = re.sub(pattern, lambda _: line, content, count=1, flags=re.MULTILINE)
              else:
                  content = content.replace('[resource]', '[resource]\n' + line, 1)
          path.write_text(content)

          preset_path = Path('export_presets.cfg')
          preset = preset_path.read_text()
          signing = {
              'keystore/debug': os.environ['BASH_KEY'],
              'keystore/debug_user': 'androiddebugkey',
              'keystore/debug_password': 'android',
          }
          for key, value in signing.items():
              pattern = r'^' + re.escape(key) + r'=.*$'
              if not re.search(pattern, preset, re.MULTILINE):
                  raise RuntimeError('Missing export preset key: ' + key)
              preset = re.sub(pattern, lambda _: key + '="' + value + '"', preset, count=1, flags=re.MULTILINE)
          preset_path.write_text(preset)
          print('SDK/JDK/keystore settings written')
          PYSET
      - name: Inspect effective Godot editor settings
        shell: bash
        run: |
          set -uo pipefail
          godot --headless --editor --path . --script tools/check_android_settings.gd > build/settings-check.txt 2>&1
          result=$?
          cat build/settings-check.txt
          exit "$result"
      - name: Check Android export requirements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          {
            echo '=== GODOT / ANDROID EXPORT REQUIREMENTS ==='
            godot --headless --version
            echo 'SDK path:' "$ANDROID_HOME"
            echo 'JDK path:' "$JAVA_HOME"
            echo 'SDK platforms:'
            ls -la "$ANDROID_HOME/platforms"
            echo 'SDK build tools:'
            ls -la "$ANDROID_HOME/build-tools"
            echo 'Godot Android template:'
            ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
            echo 'Keystore:'
            test -s "$BASH_KEY" && echo present
            echo 'Preset sections:'
            grep -E '^\[preset|^name=|^platform=|^architectures/|^package/unique_name=' export_presets.cfg
            echo 'Godot editor settings file:'
            ls -l "$HOME/.config/godot/editor_settings-4.tres"
          } 2>&1 | tee build/requirements.txt
      - name: Export debug APK
        shell: bash
        run: |
          set -uo pipefail
          godot --headless --verbose --path . --export-debug Android build/BASH-Rise-Again-debug.apk > build/export-log.txt 2>&1
          result=$?
          cat build/export-log.txt
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          test -s build/BASH-Rise-Again-debug.apk
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Settings-And-Export-Logs
          path: |
            build/import-log.txt
            build/settings-check.txt
            build/export-log.txt
            build/requirements.txt
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
