name: Build BASH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdkmanager --licenses < /dev/null || true

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          V=4.3

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"

          unzip -q \
            "Godot_v${V}-stable_linux.x86_64.zip"

          sudo install -m 755 \
            "Godot_v${V}-stable_linux.x86_64" \
            /usr/local/bin/godot

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"

          mkdir -p /tmp/godot-templates

          unzip -q \
            "Godot_v${V}-stable_export_templates.tpz" \
            -d /tmp/godot-templates

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/${V}.stable"

          cp /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${V}.stable/"

          godot --headless --version

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/bash-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "BASH_DEBUG_KEYSTORE=$RUNNER_TEMP/bash-debug.keystore" >> "$GITHUB_ENV"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          test -n "$SDK"
          test -d "$SDK"
          test -f "$BASH_DEBUG_KEYSTORE"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$BASH_DEBUG_KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Android SDK: $SDK"
          echo "Debug keystore configured"

      - name: Configure export preset signing
        shell: bash
        env:
          DEBUG_KEYSTORE: ${{ env.BASH_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()

          replacements = {
              'keystore/debug=""':
                  'keystore/debug="' + os.environ["DEBUG_KEYSTORE"] + '"',
              'keystore/debug_user=""':
                  'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""':
                  'keystore/debug_password="android"',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError("Missing export preset setting: " + old)
              text = text.replace(old, new)

          path.write_text(text)
          print("Debug signing configured")
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -o pipefail

          godot --headless \
            --editor \
            --path . \
            --import

      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/BASH-Rise-Again-v4.apk

          test -s build/BASH-Rise-Again-v4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Rise-Again-V4-APK
          path: build/BASH-Rise-Again-v4.apk
          if-no-files-found: error
