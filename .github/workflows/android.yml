name: BASH Android Export Repair
'on':
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Generate signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/bash-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "BASH_KEY=$RUNNER_TEMP/bash-debug.keystore" >> "$GITHUB_ENV"
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee build/import.log
      - name: Configure settings using Godot API
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --script tools/configure_android.gd 2>&1 | tee build/configure.log
      - name: Set debug signing in export preset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('export_presets.cfg')
          s=p.read_text()
          for key,value in {'keystore/debug':os.environ['BASH_KEY'],'keystore/debug_user':'androiddebugkey','keystore/debug_password':'android'}.items():
              pattern=r'^'+re.escape(key)+r'\s*=.*$'
              s,count=re.subn(pattern,lambda m:key+'="'+value+'"',s,count=1,flags=re.M)
              if count!=1: raise RuntimeError('Missing key: '+key)
          p.write_text(s)
          PY
      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --export-debug Android build/BASH-Rise-Again-debug.apk 2>&1 | tee build/export.log
          test -s build/BASH-Rise-Again-debug.apk
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-API-Validation-Logs
          path: build/*.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
