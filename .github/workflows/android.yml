name: BASH Android Verified Preflight

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-tpl "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-tpl
          cp /tmp/godot-tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
      - name: Prepare signing and Godot editor configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          KEY="$RUNNER_TEMP/bash-debug.keystore"
          keytool -genkeypair -noprompt -keystore "$KEY" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "BASH_KEY=$KEY" >> "$GITHUB_ENV"
          # Start the editor once to create its own settings file.
          timeout 45s godot --headless --editor --path . --quit-after 3 > build/editor-init.log 2>&1 || true
          python3 - <<'PYSET'
          import os,re
          from pathlib import Path
          p=Path.home()/'.config/godot/editor_settings-4.tres'
          if p.exists():
              s=p.read_text()
          else:
              s='[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          if '[resource]' not in s:
              s='[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          vals={
            'export/android/android_sdk_path':os.environ['ANDROID_HOME'],
            'export/android/java_sdk_path':os.environ['JAVA_HOME'],
            'export/android/debug_keystore':os.environ['BASH_KEY'],
            'export/android/debug_keystore_user':'androiddebugkey',
            'export/android/debug_keystore_pass':'android'
          }
          for k,v in vals.items():
              line=f'{k} = "{v}"'
              pattern=r'^'+re.escape(k)+r'\s*=.*$'
              if re.search(pattern,s,re.M):
                  s=re.sub(pattern,lambda _:line,s,count=1,flags=re.M)
              else:
                  s=s.replace('[resource]','[resource]\n'+line,1)
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(s)
          preset=Path('export_presets.cfg')
          d=preset.read_text()
          for k,v in [('keystore/debug',os.environ['BASH_KEY']),('keystore/debug_user','androiddebugkey'),('keystore/debug_password','android')]:
              pattern=r'^'+re.escape(k)+r'\s*=.*$'
              if not re.search(pattern,d,re.M):
                  raise SystemExit('Missing export preset option: '+k)
              d=re.sub(pattern,lambda _:f'{k}="{v}"',d,count=1,flags=re.M)
          preset.write_text(d)
          print('Editor settings and signing configured')
          PYSET
      - name: Preflight actual configuration
        shell: bash
        run: |
          set -euo pipefail
          {
            godot --headless --version
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            test -f "$JAVA_HOME/bin/javac" && echo "JDK: OK"
            test -f "$ANDROID_HOME/platforms/android-34/android.jar" && echo "Platform 34: OK"
            test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2" && echo "Build Tools: OK"
            test -f "$BASH_KEY" && echo "Keystore: OK"
            test -f "$HOME/.config/godot/editor_settings-4.tres" && echo "Editor settings file: OK"
          } | tee build/preflight.log
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --editor --path . --import 2>&1 | tee build/import.log
      - name: Export Android debug APK
        shell: bash
        run: |
          set -o pipefail
          timeout 180s godot --headless --verbose --path . --export-debug Android build/BASH-Rise-Again-debug.apk 2>&1 | tee build/export.log
          test -s build/BASH-Rise-Again-debug.apk
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Preflight-And-Export-Logs
          path: build/*.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
