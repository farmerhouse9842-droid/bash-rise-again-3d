name: BASH Android Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot-builds/releases/download/4.3-stable"

          curl -fLsS \
            "$BASE/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp

          sudo install -m 755 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          curl -fLsS \
            "$BASE/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q /tmp/templates.tpz \
            -d /tmp/godot-templates

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          cp /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/bash-debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/bash-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/bash-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path . \
            --import

      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/BASH-Rise-Again-debug.apk \
            2>&1 | tee build/export.log

          test -s build/BASH-Rise-Again-debug.apk

      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Android-Error-Log
          path: build/export.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Rise-Again-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
