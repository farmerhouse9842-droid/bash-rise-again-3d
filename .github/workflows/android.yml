name: BASH Android Container Build

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Godot environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --version

          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "JAVA_HOME=${JAVA_HOME:-unset}"

          test -f project.godot
          test -f export_presets.cfg
          test -f main.tscn

      - name: Prepare Android debug signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail

          godot --headless \
            --editor \
            --path . \
            --import \
            2>&1 | tee build/import.log

      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/BASH-Rise-Again-debug.apk \
            2>&1 | tee build/export.log

          test -s build/BASH-Rise-Again-debug.apk

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Container-Logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Android-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
