name: BASH Android APK - Controlled Repair

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$base/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$base/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure editor and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$HOME/.config/godot"
          keytool -genkeypair -keystore "$RUNNER_TEMP/bash-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/bash-debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          sdk=os.environ['ANDROID_HOME']
          java=os.environ['JAVA_HOME']
          key=os.environ['RUNNER_TEMP']+'/bash-debug.keystore'
          settings=Path.home()/'.config/godot/editor_settings-4.tres'
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'+''.join(f'{k} = "{v}"\n' for k,v in {
            'export/android/android_sdk_path':sdk,
            'export/android/java_sdk_path':java,
            'export/android/debug_keystore':key,
            'export/android/debug_keystore_user':'androiddebugkey',
            'export/android/debug_keystore_pass':'android',
          }.items()))
          preset=Path('export_presets.cfg')
          s=preset.read_text()
          import re
          for k,v in {'keystore/debug':key,'keystore/debug_user':'androiddebugkey','keystore/debug_password':'android'}.items():
            s,n=re.subn(r'^'+re.escape(k)+r'=.*$',lambda _:k+'="'+v+'"',s,count=1,flags=re.M)
            if n!=1: raise RuntimeError('Missing preset key: '+k)
          preset.write_text(s)
          print('Editor and export preset debug signing configured')
          PY
          test -s "$ANDROID_HOME/platforms/android-34/android.jar"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee build/import.txt
      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --export-debug Android build/BASH-Rise-Again-debug.apk 2>&1 | tee build/export.txt
          test -s build/BASH-Rise-Again-debug.apk
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Repair-Logs
          path: |
            build/import.txt
            build/export.txt
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Android-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
