name: BASH Android Ubuntu Build

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          curl -fLsS --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/godot-templates/templates/"* "$DEST/"
          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"
      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$HOME/.config/godot"
          KEY="$RUNNER_TEMP/bash-debug.keystore"
          keytool -genkeypair -noprompt -keystore "$KEY" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEY"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          export BASH_KEY="$KEY"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('export_presets.cfg')
          data = p.read_text()
          for k,v in {'keystore/debug':os.environ['BASH_KEY'], 'keystore/debug_user':'androiddebugkey', 'keystore/debug_password':'android'}.items():
              data,n = re.subn(r'^'+re.escape(k)+r'\s*=.*$',lambda _: k+'="'+v+'"',data,count=1,flags=re.M)
              if n != 1: raise RuntimeError('Missing export option: '+k)
          p.write_text(data)
          PY
      - name: Import project
        shell: bash
        run: |
          mkdir -p build
          godot --headless --editor --path . --import > build/import.log 2>&1 || { cat build/import.log; exit 1; }
      - name: Export debug APK
        shell: bash
        run: |
          godot --headless --verbose --path . --export-debug Android build/BASH-Rise-Again-debug.apk > build/export.log 2>&1 || { cat build/export.log; exit 1; }
          test -s build/BASH-Rise-Again-debug.apk
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Ubuntu-Logs
          path: build/*.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
