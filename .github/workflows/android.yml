name: Build BASH Android APK V5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK dependencies for Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;23.2.8568313' 'cmake;3.10.2.4988404'
          test -f "$SDK/build-tools/34.0.0/aapt2"
      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --headless --version
      - name: Configure signing and editor paths
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/bash-debug.keystore"
          keytool -genkeypair -keystore "$KEY" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          export KEY
          python3 - <<'PY'
          import os, pathlib, re
          p=pathlib.Path('export_presets.cfg')
          s=p.read_text()
          for key,val in [('keystore/debug',os.environ['KEY']),('keystore/debug_user','androiddebugkey'),('keystore/debug_password','android')]:
              s,n=re.subn(r'^'+re.escape(key)+r'="[^"]*"',lambda m:key+'="'+val+'"',s,count=1,flags=re.M)
              assert n==1, key
          p.write_text(s)
          home=pathlib.Path.home()
          settings=home/'.config/godot/editor_settings-4.tres'
          settings.parent.mkdir(parents=True,exist_ok=True)
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'+
            'export/android/android_sdk_path = "'+os.environ['ANDROID_HOME']+'"\n'+
            'export/android/java_sdk_path = "'+os.environ['JAVA_HOME']+'"\n'+
            'export/android/debug_keystore = "'+os.environ['KEY']+'"\n'+
            'export/android/debug_keystore_user = "androiddebugkey"\n'+
            'export/android/debug_keystore_pass = "android"\n')
          print('Configured SDK, Java and debug signing paths')
          PY
      - name: Import project
        shell: bash
        run: |
          mkdir -p build
          godot --headless --editor --path . --import 2>&1 | tee build/import-log.txt
      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --export-debug Android build/BASH-Rise-Again-v5.apk 2>&1 | tee build/export-log.txt
          test -s build/BASH-Rise-Again-v5.apk
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-V5-Build-Logs
          path: build/*-log.txt
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Rise-Again-V5-APK
          path: build/BASH-Rise-Again-v5.apk
          if-no-files-found: error
