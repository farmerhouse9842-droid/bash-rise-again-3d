name: BASH Android Export - Verify and Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$base/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$base/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Prepare signing and check SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -d "$JAVA_HOME"
          keytool -genkeypair -keystore "$RUNNER_TEMP/bash-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "BASH_KEY=$RUNNER_TEMP/bash-debug.keystore" >> "$GITHUB_ENV"
      - name: Import project and create real editor settings
        shell: bash
        run: |
          set -uo pipefail
          godot --headless --editor --path . --import > build/import-log.txt 2>&1
          result=$?
          cat build/import-log.txt
          exit "$result"
      - name: Configure editor settings and signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSET'
          import os,re
          from pathlib import Path
          path=Path.home()/'.config/godot/editor_settings-4.tres'
          if not path.exists(): raise RuntimeError('Godot did not create editor_settings-4.tres')
          s=path.read_text()
          if '[resource]' not in s: raise RuntimeError('Editor settings lack [resource]')
          values={'export/android/android_sdk_path':os.environ['ANDROID_HOME'], 'export/android/java_sdk_path':os.environ['JAVA_HOME'], 'export/android/debug_keystore':os.environ['BASH_KEY'], 'export/android/debug_keystore_user':'androiddebugkey', 'export/android/debug_keystore_pass':'android'}
          for k,v in values.items():
              line=k+' = "'+v+'"'
              pat=r'^'+re.escape(k)+r'\s*=.*$'
              if re.search(pat,s,re.M): s=re.sub(pat,lambda _:line,s,count=1,flags=re.M)
              else:s=s.replace('[resource]','[resource]\n'+line,1)
          path.write_text(s)
          p=Path('export_presets.cfg')
          preset=p.read_text()
          for k,v in {'keystore/debug':os.environ['BASH_KEY'],'keystore/debug_user':'androiddebugkey','keystore/debug_password':'android'}.items():
              pat=r'^'+re.escape(k)+r'=.*$'
              if not re.search(pat,preset,re.M): raise RuntimeError('Missing export preset key: '+k)
              preset=re.sub(pat,lambda _:k+'="'+v+'"',preset,count=1,flags=re.M)
          p.write_text(preset)
          print('SDK/JDK/keystore configured in editor settings and preset')
          PYSET
      - name: Inspect effective Godot editor settings
        shell: bash
        run: |
          set -uo pipefail
          godot --headless --editor --path . --script tools/check_android_settings.gd > build/settings-check.txt 2>&1
          result=$?
          cat build/settings-check.txt
          exit "$result"
      - name: Export debug APK
        shell: bash
        run: |
          set -uo pipefail
          godot --headless --verbose --path . --export-debug Android build/BASH-Rise-Again-debug.apk > build/export-log.txt 2>&1
          result=$?
          cat build/export-log.txt
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          test -s build/BASH-Rise-Again-debug.apk
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Settings-And-Export-Logs
          path: |
            build/import-log.txt
            build/settings-check.txt
            build/export-log.txt
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
