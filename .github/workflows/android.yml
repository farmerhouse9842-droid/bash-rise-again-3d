name: Build BASH Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          V=4.3
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo install -m 755 "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q "Godot_v${V}-stable_export_templates.tpz" -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import assets
        run: godot --headless --editor --path . --import
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/BASH-Rise-Again-v4.apk
          test -s build/BASH-Rise-Again-v4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BASH-Rise-Again-V4-APK
          path: build/BASH-Rise-Again-v4.apk
