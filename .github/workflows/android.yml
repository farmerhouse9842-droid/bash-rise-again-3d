name: Build BASH Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          V=4.3
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}-stable"
          wget -q "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo install -m 755 "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$BASE/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p /tmp/bash-templates "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q "Godot_v${V}-stable_export_templates.tpz" -d /tmp/bash-templates
          cp /tmp/bash-templates/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          godot --headless --version
      - name: Set up debug signing and Godot editor
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK"
          test -d "$JAVA_HOME"
          KEY="$RUNNER_TEMP/bash-debug.keystore"
          keytool -genkeypair -keystore "$KEY" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEY"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          python3 - "$KEY" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('export_presets.cfg')
          s = p.read_text()
          for k, v in {'keystore/debug': sys.argv[1], 'keystore/debug_user': 'androiddebugkey', 'keystore/debug_password': 'android'}.items():
              s, n = re.subn(r'^' + re.escape(k) + r'="[^"]*"', lambda _: k + '="' + v + '"', s, count=1, flags=re.M)
              if n != 1: raise RuntimeError('Missing preset option: ' + k)
          p.write_text(s)
          PY
          echo "SDK=$SDK JAVA_HOME=$JAVA_HOME"
          ls "$SDK/platforms" "$SDK/build-tools"
      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --editor --path . --import 2>&1 | tee build/import-log.txt
      - name: Export Android debug APK
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          godot --headless --verbose --editor --path . --export-debug Android build/BASH-Rise-Again-v4.apk 2>&1 | tee build/export-log.txt
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          test -s build/BASH-Rise-Again-v4.apk
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Build-Logs
          path: build/*-log.txt
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Rise-Again-V4-APK
          path: build/BASH-Rise-Again-v4.apk
          if-no-files-found: error
