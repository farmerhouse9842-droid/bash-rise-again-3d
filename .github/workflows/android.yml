name: BASH Android Build - No Hang

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Configure SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$HOME/.config/godot"
          KEY="$RUNNER_TEMP/bash-debug.keystore"
          keytool -genkeypair -noprompt -keystore "$KEY" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "BASH_KEY=$KEY" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEY"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('export_presets.cfg')
          s = p.read_text()
          for k, v in {'keystore/debug':os.environ['RUNNER_TEMP']+'/bash-debug.keystore', 'keystore/debug_user':'androiddebugkey', 'keystore/debug_password':'android'}.items():
              pattern = r'^' + re.escape(k) + r'\s*=.*$'
              s, n = re.subn(pattern, lambda _: k+'="'+v+'"', s, count=1, flags=re.M)
              if n != 1: raise RuntimeError('Missing preset setting: '+k)
          p.write_text(s)
          PY
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --editor --path . --import 2>&1 | tee build/import.log
      - name: Verify paths without opening editor
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . --script tools/configure_android.gd 2>&1 | tee build/check.log
      - name: Export debug APK
        shell: bash
        run: |
          set -o pipefail
          timeout 180s godot --headless --path . --export-debug Android build/BASH-Rise-Again-debug.apk 2>&1 | tee build/export.log
          test -s build/BASH-Rise-Again-debug.apk
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-No-Hang-Logs
          path: build/*.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Debug-APK
          path: build/BASH-Rise-Again-debug.apk
          if-no-files-found: error
