name: Build BASH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          V=4.3

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"

          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"

          sudo install -m 755 \
            "Godot_v${V}-stable_linux.x86_64" \
            /usr/local/bin/godot

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"

          mkdir -p /tmp/godot-templates

          unzip -q \
            "Godot_v${V}-stable_export_templates.tpz" \
            -d /tmp/godot-templates

          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"

          cp /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${V}.stable/"

          godot --headless --version

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/bash-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "BASH_DEBUG_KEYSTORE=$RUNNER_TEMP/bash-debug.keystore" >> "$GITHUB_ENV"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          test -n "$SDK"
          test -d "$SDK"
          test -f "$BASH_DEBUG_KEYSTORE"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$BASH_DEBUG_KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Configure export signing
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("export_presets.cfg")
          data = p.read_text()

          values = {
              "keystore/debug":
                  os.environ["BASH_DEBUG_KEYSTORE"],
              "keystore/debug_user":
                  "androiddebugkey",
              "keystore/debug_password":
                  "android",
          }

          import re

          for key, value in values.items():
              pattern = r'^' + re.escape(key) + r'="[^"]*"'
              replacement = key + '="' + value + '"'
              data, count = re.subn(
                  pattern,
                  lambda m, v=replacement: v,
                  data,
                  count=1,
                  flags=re.MULTILINE
              )
              if count != 1:
                  raise RuntimeError(
                      "Missing preset option: " + key
                  )

          p.write_text(data)
          print("Signing configured")
          PY

      - name: Diagnose Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Java:"
          java -version

          echo "Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo "Android build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "Godot templates:"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"

          echo "Debug keystore:"
          test -f "$BASH_DEBUG_KEYSTORE"
          echo "Keystore found"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path . \
            --import

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/BASH-Rise-Again-v4.apk

          test -s build/BASH-Rise-Again-v4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Rise-Again-V4-APK
          path: build/BASH-Rise-Again-v4.apk
          if-no-files-found: error
