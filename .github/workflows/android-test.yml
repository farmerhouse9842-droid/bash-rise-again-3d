name: BASH Android Clean Export Test

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-export:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.3-stable"

          curl -fLsS \
            "$BASE/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp

          sudo install -m 755 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          curl -fLsS \
            "$BASE/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q /tmp/templates.tpz \
            -d /tmp/godot-templates

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          cp /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          godot --headless --version

      - name: Create clean test project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/bash-clean-test

          cat > /tmp/bash-clean-test/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="BASH Clean Test"
          run/main_scene="res://main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          cat > /tmp/bash-clean-test/main.tscn <<'EOF'
          [gd_scene format=3]

          [node name="Main" type="Node2D"]
          EOF

          cat > /tmp/bash-clean-test/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="clean-test.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.bash.cleantest"
          package/name="BASH Clean Test"
          version/code=1
          version/name="1.0"
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          EOF

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2"

      - name: Import clean project
        shell: bash
        run: |
          mkdir -p clean-results

          godot --headless \
            --editor \
            --path /tmp/bash-clean-test \
            --import \
            > clean-results/import.txt 2>&1

          cat clean-results/import.txt

      - name: Export clean test APK
        shell: bash
        run: |
          mkdir -p clean-results

          set +e

          godot --headless \
            --verbose \
            --path /tmp/bash-clean-test \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/clean-results/clean-test.apk" \
            > clean-results/export.txt 2>&1

          RESULT=$?

          cat clean-results/export.txt

          echo "Export exit code: $RESULT" \
            > clean-results/result.txt

          if [ "$RESULT" -eq 0 ] && \
             [ -s clean-results/clean-test.apk ]; then
            echo "CLEAN EXPORT SUCCESS" \
              >> clean-results/result.txt
          else
            echo "CLEAN EXPORT FAILED" \
              >> clean-results/result.txt
          fi

          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASH-Clean-Export-Test-Results
          path: clean-results/
          if-no-files-found: warn
